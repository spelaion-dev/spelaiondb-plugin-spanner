# HTTPS in front of the test server: TLS on 9443, the emulator's plain REST port behind it.
global
  log stdout format raw local0

defaults
  mode tcp
  timeout connect 10s
  timeout client 1h
  timeout server 1h

frontend https
  bind :9443 ssl crt /usr/local/etc/haproxy/server.pem
  default_backend spanner

backend spanner
  server spanner spanner:9020
